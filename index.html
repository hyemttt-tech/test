<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>스네이크 게임</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      background: #111827;
      color: #e5e7eb;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding-top: 40px;
    }

    h1 {
      margin-bottom: 10px;
      font-size: 28px;
      letter-spacing: 1px;
    }

    .info {
      margin-bottom: 20px;
      font-size: 14px;
      color: #9ca3af;
      text-align: center;
      line-height: 1.5;
    }

    .game-wrapper {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 16px;
      border-radius: 12px;
      background: #020617;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }

    #gameCanvas {
      background: #020617;
      border-radius: 8px;
      border: 2px solid #1f2937;
      image-rendering: pixelated;
    }

    .hud {
      display: flex;
      justify-content: space-between;
      width: 100%;
      font-size: 14px;
      color: #9ca3af;
    }

    .hud span {
      font-weight: 600;
      color: #e5e7eb;
    }

    .controls {
      display: flex;
      gap: 8px;
      margin-top: 6px;
    }

    button {
      border: none;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 13px;
      cursor: pointer;
      background: #1d4ed8;
      color: #e5e7eb;
      transition: background 0.15s ease, transform 0.05s ease;
    }

    button.secondary {
      background: #374151;
    }

    button:hover {
      background: #2563eb;
    }

    button.secondary:hover {
      background: #4b5563;
    }

    button:active {
      transform: translateY(1px);
    }

    .status {
      margin-top: 6px;
      font-size: 13px;
      color: #9ca3af;
      min-height: 18px;
    }

    .status strong {
      color: #f97316;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .overlay-message {
      background: rgba(15, 23, 42, 0.92);
      border-radius: 12px;
      padding: 18px 22px;
      text-align: center;
      color: #e5e7eb;
      font-size: 14px;
      line-height: 1.6;
      border: 1px solid #1f2937;
      pointer-events: auto;
    }

    .overlay-message h2 {
      font-size: 18px;
      margin-bottom: 8px;
    }

    .overlay-message p {
      margin-bottom: 4px;
    }

    .overlay-message .hint {
      font-size: 12px;
      color: #9ca3af;
      margin-top: 4px;
    }

    .game-container {
      position: relative;
    }

    @media (max-width: 600px) {
      #gameCanvas {
        width: 300px;
        height: 300px;
      }
    }
  </style>
</head>
<body>
  <h1>스네이크 게임</h1>
  <div class="info">
    방향키(↑↓←→)로 뱀을 조종해서 먹이를 먹어보세요.<br />
    벽이나 자기 몸에 부딪히면 게임 오버입니다.
  </div>

  <div class="game-wrapper">
    <div class="hud">
      <div>점수: <span id="score">0</span></div>
      <div>최고 점수: <span id="highScore">0</span></div>
    </div>

    <div class="game-container">
      <canvas id="gameCanvas" width="400" height="400"></canvas>
      <div class="overlay" id="overlay">
        <div class="overlay-message" id="overlayMessage">
          <h2>스페이스바 또는 시작 버튼으로 시작</h2>
          <p>방향키로 이동, 먹이를 먹으면 길어집니다.</p>
          <p class="hint">게임 중 다시 시작하려면 R 키를 누르세요.</p>
        </div>
      </div>
    </div>

    <div class="controls">
      <button id="startBtn">시작 / 일시정지</button>
      <button id="resetBtn" class="secondary">리셋</button>
    </div>

    <div class="status" id="statusText"></div>
  </div>

  <script>
    // ===== 기본 설정 =====
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const tileCount = 20;          // 가로/세로 타일 개수
    const tileSize = canvas.width / tileCount; // 타일 크기

    let snake = [];
    let direction = { x: 1, y: 0 }; // 초기 방향: 오른쪽
    let nextDirection = { x: 1, y: 0 };
    let food = { x: 10, y: 10 };
    let score = 0;
    let highScore = Number(localStorage.getItem("snakeHighScore") || 0);
    let gameLoopId = null;
    let gameSpeed = 120; // ms
    let isRunning = false;
    let isGameOver = false;

    const scoreEl = document.getElementById("score");
    const highScoreEl = document.getElementById("highScore");
    const statusText = document.getElementById("statusText");
    const overlay = document.getElementById("overlay");
    const overlayMessage = document.getElementById("overlayMessage");
    const startBtn = document.getElementById("startBtn");
    const resetBtn = document.getElementById("resetBtn");

    highScoreEl.textContent = highScore;

    // ===== 초기화 함수 =====
    function initGame() {
      snake = [
        { x: 8, y: 10 },
        { x: 7, y: 10 },
        { x: 6, y: 10 }
      ];
      direction = { x: 1, y: 0 };
      nextDirection = { x: 1, y: 0 };
      score = 0;
      scoreEl.textContent = score;
      isGameOver = false;
      statusText.textContent = "";
      spawnFood();
      draw();
      showOverlay("스페이스바 또는 시작 버튼으로 시작", "방향키로 이동, 먹이를 먹으면 길어집니다.");
    }

    // ===== 먹이 생성 =====
    function spawnFood() {
      let newFood;
      while (true) {
        newFood = {
          x: Math.floor(Math.random() * tileCount),
          y: Math.floor(Math.random() * tileCount)
        };
        const onSnake = snake.some(seg => seg.x === newFood.x && seg.y === newFood.y);
        if (!onSnake) break;
      }
      food = newFood;
    }

    // ===== 게임 루프 =====
    function startGameLoop() {
      if (gameLoopId) return;
      isRunning = true;
      hideOverlay();
      statusText.textContent = "게임 진행 중...";
      gameLoopId = setInterval(() => {
        update();
        draw();
      }, gameSpeed);
    }

    function stopGameLoop() {
      isRunning = false;
      if (gameLoopId) {
        clearInterval(gameLoopId);
        gameLoopId = null;
      }
    }

    // ===== 업데이트 로직 =====
    function update() {
      if (isGameOver) return;

      // 방향 업데이트(한 틱에 한 번만 반영)
      direction = { ...nextDirection };

      const head = snake[0];
      const newHead = {
        x: head.x + direction.x,
        y: head.y + direction.y
      };

      // 벽 충돌 체크
      if (
        newHead.x < 0 ||
        newHead.x >= tileCount ||
        newHead.y < 0 ||
        newHead.y >= tileCount
      ) {
        endGame("벽에 부딪혔어요!");
        return;
      }

      // 자기 몸 충돌 체크
      if (snake.some(seg => seg.x === newHead.x && seg.y === newHead.y)) {
        endGame("자기 몸에 부딪혔어요!");
        return;
      }

      // 머리 추가
      snake.unshift(newHead);

      // 먹이 먹었는지 체크
      if (newHead.x === food.x && newHead.y === food.y) {
        score += 10;
        scoreEl.textContent = score;
        if (score > highScore) {
          highScore = score;
          highScoreEl.textContent = highScore;
          localStorage.setItem("snakeHighScore", highScore);
        }
        spawnFood();
      } else {
        // 꼬리 제거
        snake.pop();
      }
    }

    // ===== 그리기 =====
    function draw() {
      // 배경
      ctx.fillStyle = "#020617";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 그리드(선택 사항)
      ctx.strokeStyle = "#0f172a";
      ctx.lineWidth = 1;
      for (let i = 0; i <= tileCount; i++) {
        ctx.beginPath();
        ctx.moveTo(i * tileSize, 0);
        ctx.lineTo(i * tileSize, canvas.height);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, i * tileSize);
        ctx.lineTo(canvas.width, i * tileSize);
        ctx.stroke();
      }

      // 먹이
      ctx.fillStyle = "#f97316";
      ctx.beginPath();
      ctx.roundRect(
        food.x * tileSize + 2,
        food.y * tileSize + 2,
        tileSize - 4,
        tileSize - 4,
        4
      );
      ctx.fill();

      // 뱀
      snake.forEach((seg, index) => {
        const isHead = index === 0;
        const baseX = seg.x * tileSize;
        const baseY = seg.y * tileSize;

        // 몸통
        const gradient = ctx.createLinearGradient(
          baseX,
          baseY,
          baseX + tileSize,
          baseY + tileSize
        );
        gradient.addColorStop(0, isHead ? "#22c55e" : "#16a34a");
        gradient.addColorStop(1, isHead ? "#4ade80" : "#22c55e");

        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.roundRect(
          baseX + 2,
          baseY + 2,
          tileSize - 4,
          tileSize - 4,
          isHead ? 6 : 4
        );
        ctx.fill();

        // 머리 눈
        if (isHead) {
          ctx.fillStyle = "#022c22";
          const eyeSize = tileSize * 0.12;
          const offsetX = direction.x === 0 ? tileSize * 0.2 : direction.x > 0 ? tileSize * 0.45 : tileSize * 0.15;
          const offsetY = direction.y === 0 ? tileSize * 0.2 : direction.y > 0 ? tileSize * 0.45 : tileSize * 0.15;

          // 왼쪽 눈
          ctx.beginPath();
          ctx.arc(
            baseX + offsetX,
            baseY + offsetY,
            eyeSize,
            0,
            Math.PI * 2
          );
          ctx.fill();

          // 오른쪽 눈
          ctx.beginPath();
          ctx.arc(
            baseX + tileSize - offsetX,
            baseY + offsetY,
            eyeSize,
            0,
            Math.PI * 2
          );
          ctx.fill();
        }
      });
    }

    // ===== 게임 종료 =====
    function endGame(reason) {
      isGameOver = true;
      stopGameLoop();
      statusText.innerHTML = `<strong>게임 오버:</strong> ${reason} (점수: ${score})`;
      showOverlay("게임 오버", `${reason} 점수: ${score}`, "R 키 또는 리셋 버튼으로 다시 시작하세요.");
    }

    // ===== 오버레이 =====
    function showOverlay(title, line1, line2) {
      overlay.style.display = "flex";
      overlayMessage.innerHTML = `
        <h2>${title}</h2>
        <p>${line1 || ""}</p>
        ${line2 ? `<p class="hint">${line2}</p>` : ""}
      `;
    }

    function hideOverlay() {
      overlay.style.display = "none";
    }

    // ===== 입력 처리 =====
    function handleKeyDown(e) {
      const key = e.key;

      if (key === " " || key === "Spacebar") {
        // 스페이스바: 시작/일시정지
        e.preventDefault();
        if (isGameOver) return;
        if (isRunning) {
          stopGameLoop();
          statusText.textContent = "일시정지됨";
          showOverlay("일시정지", "스페이스바 또는 시작 버튼으로 재개하세요.");
        } else {
          startGameLoop();
        }
        return;
      }

      if (key === "r" || key === "R") {
        // R: 리셋
        initGame();
        return;
      }

      // 방향키
      let newDir = null;
      if (key === "ArrowUp") newDir = { x: 0, y: -1 };
      if (key === "ArrowDown") newDir = { x: 0, y: 1 };
      if (key === "ArrowLeft") newDir = { x: -1, y: 0 };
      if (key === "ArrowRight") newDir = { x: 1, y: 0 };

      if (newDir) {
        // 반대 방향으로 바로 꺾는 것 방지
        if (newDir.x === -direction.x && newDir.y === -direction.y) return;
        nextDirection = newDir;
      }
    }

    document.addEventListener("keydown", handleKeyDown);

    // 버튼 이벤트
    startBtn.addEventListener("click", () => {
      if (isGameOver) return;
      if (isRunning) {
        stopGameLoop();
        statusText.textContent = "일시정지됨";
        showOverlay("일시정지", "시작 버튼 또는 스페이스바로 재개하세요.");
      } else {
        startGameLoop();
      }
    });

    resetBtn.addEventListener("click", () => {
      initGame();
    });

    // ===== 시작 =====
    initGame();
  </script>
</body>
</html>
